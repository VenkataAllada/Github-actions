name: Exploring Variables and Secrets

on:
  push

##################### Environment variables at workflow Level ##########################
env: 
    CONTAINER_REGISTRY: docker.io
    IMAGE_NAME: github-actions-nginx

jobs:
    docker:
     runs-on: ubuntu-latest
     steps:
     - name: Docker build
       run: echo docker build -t ${{env.CONTAINER_REGISTRY}}/$DOCKER_USER_NAME/$IMAGE_NAME:latest
              
     - name : Docker Login
       run: echo docker login --username=$DOCKER_USERNAME --password=${{secrets.DOCKER_PASSWORD}}

     - name: Docker Publish
       run: echo docker push -t ${{env.CONTAINER_REGISTRY}}/$DOCKER_USER_NAME/$IMAGE_NAME:latest  
              
    deploy:
      needs: docker
      runs-on: ubuntu-latest
      steps:
      - name: Docker Run
        run: echo docker run -d -p 8080:80 $CONTAINER_REGISTRY/$DOCKER_USER_NAME/$IMAGE_NAME:latest
















